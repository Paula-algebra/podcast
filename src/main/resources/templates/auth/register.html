<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — PodCast</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #1a0d2e; --surface: #25193d; --surface-2: #2f2049;
            --border: #3d2d5e; --accent: #ff6b6b; --accent-hover: #ee5454;
            --coral: #ff8a65; --purple: #8b5cf6;
            --text: #f5f0ff; --text-muted: #a89bc7; --danger: #ff5c6c;
        }
        body { background: linear-gradient(135deg, #1a0d2e 0%, #2d1b4e 50%, #1a0d2e 100%); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-box { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2.75rem 2rem; width: 100%; max-width: 420px; box-shadow: 0 24px 60px rgba(0,0,0,0.4), 0 0 40px rgba(255,107,107,0.1); }
        .brand-section { text-align: center; margin-bottom: 2rem; }
        .brand-icon { width: 72px; height: 72px; margin: 0 auto 1rem; background: linear-gradient(135deg, var(--accent) 0%, var(--coral) 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255,107,107,0.4); position: relative; }
        .brand-icon::before { content: ''; position: absolute; inset: -8px; background: radial-gradient(circle, rgba(255,107,107,0.3) 0%, transparent 70%); border-radius: 50%; z-index: -1; }
        .brand-icon svg { width: 38px; height: 38px; fill: var(--text); }
        .brand { font-size: 1.5rem; font-weight: 900; color: var(--text); letter-spacing: -0.5px; margin-bottom: 0.25rem; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; }
        .waveform-deco { display: flex; align-items: center; justify-content: center; gap: 3px; margin: 0.6rem 0 0; height: 16px; }
        .waveform-deco .bar { width: 3px; background: var(--accent); border-radius: 2px; opacity: 0.7; }
        .waveform-deco .bar:nth-child(1) { height: 40%; }
        .waveform-deco .bar:nth-child(2) { height: 70%; }
        .waveform-deco .bar:nth-child(3) { height: 100%; }
        .waveform-deco .bar:nth-child(4) { height: 60%; }
        .waveform-deco .bar:nth-child(5) { height: 90%; }
        .waveform-deco .bar:nth-child(6) { height: 45%; }
        .waveform-deco .bar:nth-child(7) { height: 80%; }
        .waveform-deco .bar:nth-child(8) { height: 35%; }

        .form-group { margin-bottom: 1.1rem; }
        .form-label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 0.4rem; }
        .form-control { width: 100%; background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text); padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.95rem; transition: all 0.2s; }
        .form-control:focus { outline: none; border-color: var(--accent); background: var(--bg); box-shadow: 0 0 0 3px rgba(255,107,107,0.15); }
        .form-control::placeholder { color: #6b5a87; }
        .btn-submit { display: block; width: 100%; padding: 0.9rem; background: linear-gradient(135deg, var(--accent) 0%, var(--coral) 100%); color: var(--text); border: none; border-radius: 12px; font-size: 0.9rem; font-weight: 800; cursor: pointer; margin-top: 1.5rem; letter-spacing: 1.5px; text-transform: uppercase; transition: all 0.2s; box-shadow: 0 6px 20px rgba(255,107,107,0.35); }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 26px rgba(255,107,107,0.45); }
        .alert-danger { padding: 0.75rem 1rem; border-radius: 10px; margin-bottom: 1.25rem; font-size: 0.875rem; background: rgba(255,92,108,0.1); border: 1px solid rgba(255,92,108,0.3); color: var(--danger); }
        .field-error { color: var(--danger); font-size: 0.78rem; margin-top: 0.25rem; }
        .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted); }
        .footer-link a { color: var(--accent); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
<div class="auth-box">
    <div class="brand-section">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
        </div>
        <div class="brand">Create Account</div>
        <div class="waveform-deco">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="subtitle">Start your podcast journal.</div>
    </div>

    <div th:if="${errorMessage}" class="alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}">
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input id="username" class="form-control" type="text" th:field="*{username}" placeholder="your_handle" autocomplete="username">
            <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input id="email" class="form-control" type="email" th:field="*{email}" placeholder="you@example.com" autocomplete="email">
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input id="password" class="form-control" type="password" th:field="*{password}" placeholder="min. 6 characters" autocomplete="new-password">
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="footer-link">Already have an account? <a th:href="@{/auth/login}">Sign in</a></div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit Episode — PodCast' : 'New Episode — PodCast'">Form — PodCast</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #1a0d2e; --surface: #25193d; --surface-2: #2f2049;
            --border: #3d2d5e; --accent: #ff6b6b; --accent-hover: #ee5454;
            --coral: #ff8a65; --purple: #8b5cf6; --text: #f5f0ff;
            --text-muted: #a89bc7; --danger: #ff5c6c;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        a { color: var(--accent); text-decoration: none; }
        .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; height: 64px; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
        .navbar-brand { display: flex; align-items: center; gap: 0.7rem; font-size: 1.4rem; font-weight: 900; color: var(--text); letter-spacing: -0.5px; }
        .navbar-brand .accent { background: linear-gradient(135deg, var(--accent) 0%, var(--coral) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent) 0%, var(--coral) 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(255,107,107,0.3); }
        .brand-icon svg { width: 22px; height: 22px; fill: var(--text); }

        .btn { display: inline-flex; align-items: center; padding: 0.65rem 1.25rem; border-radius: 10px; border: 1px solid transparent; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.15s; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--coral) 100%); color: var(--text); }
        .btn-primary:hover { box-shadow: 0 4px 14px rgba(255,107,107,0.35); }
        .btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
        .btn-outline:hover { background: var(--surface-2); color: var(--accent); border-color: var(--accent); }

        .main { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem; }
        .breadcrumb { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; font-weight: 500; }
        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2.25rem; box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
        .form-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 1.75rem; letter-spacing: -0.5px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .fg { display: flex; flex-direction: column; gap: 0.4rem; }
        .fg.full { grid-column: 1 / -1; }
        .fg label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
        .required::after { content: ' *'; color: var(--accent); }
        .form-control, .form-select { background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text); padding: 0.65rem 0.9rem; border-radius: 10px; font-size: 0.9rem; appearance: none; width: 100%; transition: all 0.2s; }
        .form-control:focus, .form-select:focus { outline: none; border-color: var(--accent); background: var(--bg); box-shadow: 0 0 0 3px rgba(255,107,107,0.1); }
        .form-control::placeholder { color: #6b5a87; }
        textarea.form-control { resize: vertical; min-height: 100px; font-family: inherit; }
        .field-error { color: var(--danger); font-size: 0.78rem; }
        .section-label { grid-column: 1 / -1; font-size: 0.7rem; font-weight: 800; color: var(--accent-soft); text-transform: uppercase; letter-spacing: 1.5px; padding-top: 0.75rem; border-top: 1px solid var(--border); }

        .checkbox-group { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; }
        .checkbox-wrap { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.15s; }
        .checkbox-wrap:hover { border-color: var(--accent); }
        .checkbox-wrap input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
        .checkbox-label { display: flex; flex-direction: column; cursor: pointer; flex: 1; }
        .checkbox-title { font-size: 0.85rem; font-weight: 700; color: var(--text); }

        .form-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/episodes}">
        <span class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg></span>
        <span><span class="accent">Pod</span>Cast</span>
    </a>
</nav>

<div class="main">
    <div class="breadcrumb">
        <a th:href="@{/episodes}">My Queue</a> /
        <span th:text="${editMode} ? 'Edit episode' : 'New episode'"></span>
    </div>

    <div class="form-card">
        <h2 class="form-title" th:text="${editMode} ? 'Edit Episode' : 'Add a New Episode'"></h2>

        <form th:action="${editMode} ? @{/episodes/edit/{id}(id=${episode.id})} : @{/episodes/new}"
              method="post" th:object="${episode}">

            <div class="form-grid">

                <div class="section-label">Episode Info</div>

                <div class="fg full">
                    <label class="required">Episode Title</label>
                    <input class="form-control" type="text" th:field="*{title}" placeholder="e.g. The Wellness Industrial Complex">
                    <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>

                <div class="fg">
                    <label class="required">Show Name</label>
                    <input class="form-control" type="text" th:field="*{showName}" placeholder="e.g. Maintenance Phase">
                    <span class="field-error" th:if="${#fields.hasErrors('showName')}" th:errors="*{showName}"></span>
                </div>

                <div class="fg">
                    <label class="required">Hosts</label>
                    <input class="form-control" type="text" th:field="*{hosts}" placeholder="e.g. Aubrey Gordon, Michael Hobbes">
                    <span class="field-error" th:if="${#fields.hasErrors('hosts')}" th:errors="*{hosts}"></span>
                </div>

                <div class="fg">
                    <label>Guests</label>
                    <input class="form-control" type="text" th:field="*{guests}" placeholder="e.g. Brian Chesky">
                </div>

                <div class="fg">
                    <label>Network</label>
                    <input class="form-control" type="text" th:field="*{network}" placeholder="e.g. Spotify, Acast">
                </div>

                <div class="fg">
                    <label>Episode Number</label>
                    <input class="form-control" type="text" th:field="*{episodeNumber}" placeholder="e.g. S3E12, EP 178">
                </div>

                <div class="fg">
                    <label>Season Number</label>
                    <input class="form-control" type="number" th:field="*{seasonNumber}" min="1" max="50" placeholder="e.g. 3">
                </div>

                <div class="fg">
                    <label class="required">Category</label>
                    <select class="form-select" th:field="*{category}">
                        <option value="">Select...</option>
                        <option th:each="c : ${categories}" th:value="${c}"
                                th:text="${#strings.replace(c.name(),'_',' ')}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
                </div>

                <div class="fg">
                    <label class="required">Listening Status</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="">Select...</option>
                        <option th:each="s : ${statuses}" th:value="${s}"
                                th:text="${#strings.replace(s.name(),'_',' ')}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                </div>

                <div class="section-label">Listening Details</div>

                <div class="fg">
                    <label>Listening Context</label>
                    <select class="form-select" th:field="*{listeningContext}">
                        <option value="">Select...</option>
                        <option th:each="c : ${contexts}" th:value="${c}"
                                th:text="${#strings.replace(c.name(),'_',' ')}"></option>
                    </select>
                </div>

                <div class="fg">
                    <label>Playback Speed</label>
                    <select class="form-select" th:field="*{playbackSpeed}">
                        <option value="">Select...</option>
                        <option th:each="s : ${speeds}" th:value="${s}"
                                th:text="${#strings.replace(#strings.replace(s.name(),'SPEED_',''),'_','.')}"></option>
                    </select>
                </div>

                <div class="fg">
                    <label>Duration (minutes)</label>
                    <input class="form-control" type="number" th:field="*{durationMinutes}" min="1" max="900" placeholder="e.g. 92">
                    <span class="field-error" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></span>
                </div>

                <div class="fg">
                    <label>Minutes Listened</label>
                    <input class="form-control" type="number" th:field="*{minutesListened}" min="0" max="900" placeholder="e.g. 45">
                    <span class="field-error" th:if="${#fields.hasErrors('minutesListened')}" th:errors="*{minutesListened}"></span>
                </div>

                <div class="fg">
                    <label>Rating (1-5 stars)</label>
                    <input class="form-control" type="number" th:field="*{rating}" min="1" max="5" placeholder="1-5">
                    <span class="field-error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></span>
                </div>

                <div class="fg">
                    <label>Release Date</label>
                    <input class="form-control" type="date" th:field="*{releaseDate}">
                </div>

                <div class="fg">
                    <label>Listened Date</label>
                    <input class="form-control" type="date" th:field="*{listenedDate}">
                </div>

                <div class="fg">
                    <label>Main Topic</label>
                    <input class="form-control" type="text" th:field="*{mainTopic}" placeholder="e.g. Wellness industry, dopamine">
                </div>

                <div class="section-label">Quality Scores (1-10)</div>

                <div class="fg">
                    <label>📝 Content Quality</label>
                    <input class="form-control" type="number" th:field="*{contentQuality}" min="1" max="10" placeholder="1-10">
                </div>

                <div class="fg">
                    <label>🎙 Audio Quality</label>
                    <input class="form-control" type="number" th:field="*{audioQuality}" min="1" max="10" placeholder="1-10">
                </div>

                <div class="fg">
                    <label>🤝 Host Chemistry</label>
                    <input class="form-control" type="number" th:field="*{hostChemistry}" min="1" max="10" placeholder="1-10">
                </div>

                <div class="fg">
                    <label>⟳ Re-listen Value</label>
                    <input class="form-control" type="number" th:field="*{rewatchValue}" min="1" max="10" placeholder="1-10">
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-wrap" for="subscribed">
                        <input id="subscribed" type="checkbox" th:field="*{subscribed}">
                        <span class="checkbox-label"><span class="checkbox-title">⭐ Subscribed</span></span>
                    </label>
                    <label class="checkbox-wrap" for="recommendToFriend">
                        <input id="recommendToFriend" type="checkbox" th:field="*{recommendToFriend}">
                        <span class="checkbox-label"><span class="checkbox-title">♡ Recommend</span></span>
                    </label>
                    <label class="checkbox-wrap" for="bookmarkedQuote">
                        <input id="bookmarkedQuote" type="checkbox" th:field="*{bookmarkedQuote}">
                        <span class="checkbox-label"><span class="checkbox-title">🔖 Bookmarked</span></span>
                    </label>
                    <label class="checkbox-wrap" for="explicitContent">
                        <input id="explicitContent" type="checkbox" th:field="*{explicitContent}">
                        <span class="checkbox-label"><span class="checkbox-title">🅴 Explicit</span></span>
                    </label>
                </div>

                <div class="section-label">Listening Journal</div>

                <div class="fg full">
                    <label>Mood / Vibe Tags</label>
                    <input class="form-control" type="text" th:field="*{moodTags}" placeholder="e.g. Chaotic, hilarious, mid-week therapy">
                    <span class="field-error" th:if="${#fields.hasErrors('moodTags')}" th:errors="*{moodTags}"></span>
                </div>

                <div class="fg full">
                    <label>Memorable Quote</label>
                    <textarea class="form-control" th:field="*{memorableQuote}" placeholder="A line that stuck with you..." style="min-height: 70px;"></textarea>
                    <span class="field-error" th:if="${#fields.hasErrors('memorableQuote')}" th:errors="*{memorableQuote}"></span>
                </div>

                <div class="fg full">
                    <label>💡 Key Takeaway</label>
                    <input class="form-control" type="text" th:field="*{keyTakeaway}" placeholder="The main lesson or insight you took away">
                    <span class="field-error" th:if="${#fields.hasErrors('keyTakeaway')}" th:errors="*{keyTakeaway}"></span>
                </div>

                <div class="fg full">
                    <label>My Review</label>
                    <textarea class="form-control" th:field="*{review}" placeholder="Worth listening? Hot takes?"></textarea>
                </div>

                <div class="fg full">
                    <label>Personal Notes</label>
                    <textarea class="form-control" th:field="*{personalNotes}" placeholder="Private thoughts, follow-ups, things to remember..."></textarea>
                </div>

            </div>

            <div class="form-actions">
                <a th:href="@{/episodes}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary"
                        th:text="${editMode} ? 'Save changes' : 'Add to Queue'"></button>
            </div>
        </form>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${episode.title} + ' — PodCast'">Episode — PodCast</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #1a0d2e; --surface: #25193d; --surface-2: #2f2049;
            --border: #3d2d5e; --accent: #ff6b6b; --accent-hover: #ee5454;
            --accent-soft: #ff9999; --coral: #ff8a65; --gold: #ffd166;
            --purple: #8b5cf6; --pink: #ec4899; --teal: #4dd4ac;
            --text: #f5f0ff; --text-muted: #a89bc7;
            --success: #4dd4ac; --danger: #ff5c6c; --info: #60a5fa;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        a { color: var(--accent-soft); text-decoration: none; }
        .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
        .navbar-brand { display: flex; align-items: center; gap: 0.7rem; font-size: 1.4rem; font-weight: 900; color: var(--text); letter-spacing: -0.5px; }
        .navbar-brand .accent { background: linear-gradient(135deg, var(--accent) 0%, var(--coral) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent) 0%, var(--coral) 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(255,107,107,0.3); }
        .brand-icon svg { width: 22px; height: 22px; fill: var(--text); }
        .navbar-nav { display: flex; align-items: center; gap: 1.5rem; list-style: none; }
        .navbar-nav a { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
        .user-badge { background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 0.25rem 0.85rem; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

        .btn { display: inline-flex; align-items: center; padding: 0.55rem 1.1rem; border-radius: 10px; border: 1px solid transparent; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.15s; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--coral) 100%); color: var(--text); }
        .btn-primary:hover { box-shadow: 0 4px 14px rgba(255,107,107,0.35); }
        .btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
        .btn-outline:hover { background: var(--surface-2); color: var(--accent-soft); border-color: var(--accent); }
        .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: var(--text); }
        .btn-sm { padding: 0.32rem 0.8rem; font-size: 0.78rem; }

        .main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
        .breadcrumb { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; font-weight: 500; }

        .detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.4); }

        .status-stripe-large { height: 6px; }
        .status-stripe-large.queued            { background: var(--info); }
        .status-stripe-large.listening         { background: linear-gradient(90deg, var(--accent) 0%, var(--coral) 100%); }
        .status-stripe-large.finished          { background: var(--success); }
        .status-stripe-large.skipped           { background: var(--danger); opacity: 0.4; }
        .status-stripe-large.saved_for_later   { background: var(--gold); }

        .hero { padding: 2.5rem 2rem 1.5rem; background: linear-gradient(135deg, var(--surface-2) 0%, var(--surface) 100%); border-bottom: 1px solid var(--border); position: relative; }
        .show-line-hero { font-size: 0.85rem; font-weight: 800; color: var(--accent-soft); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .subscribed-icon { color: var(--gold); }
        .episode-title { font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 0.75rem; line-height: 1.15; }
        .hosts-line { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.3rem; }
        .hosts-line strong { color: var(--text); font-weight: 800; }
        .meta-line { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
        .meta-line span { color: var(--text); font-weight: 600; }

        .stars-large { display: inline-flex; gap: 0.15rem; font-size: 1.4rem; margin-bottom: 1rem; }
        .star-filled { color: var(--gold); }
        .star-empty { color: var(--border); }

        .badges-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
        .badge { display: inline-block; padding: 0.3rem 0.85rem; border-radius: 999px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
        .badge-category { background: rgba(139,92,246,0.15); color: var(--purple); border: 1px solid rgba(139,92,246,0.3); }
        .badge-status-queued            { background: rgba(96,165,250,0.12); color: var(--info); border: 1px solid rgba(96,165,250,0.3); }
        .badge-status-listening         { background: rgba(255,107,107,0.12); color: var(--accent-soft); border: 1px solid rgba(255,107,107,0.3); }
        .badge-status-finished          { background: rgba(77,212,172,0.12); color: var(--success); border: 1px solid rgba(77,212,172,0.3); }
        .badge-status-skipped           { background: rgba(255,92,108,0.08); color: var(--danger); border: 1px solid rgba(255,92,108,0.25); }
        .badge-status-saved_for_later   { background: rgba(255,209,102,0.12); color: var(--gold); border: 1px solid rgba(255,209,102,0.3); }
        .badge-explicit { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
        .badge-speed { background: rgba(77,212,172,0.1); color: var(--teal); border: 1px solid rgba(77,212,172,0.25); font-family: 'SF Mono', Monaco, monospace; }
        .badge-context { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }

        .body-section { padding: 2rem; }
        .section-title { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 0.85rem; font-weight: 800; }

        .player-card { background: linear-gradient(135deg, var(--accent) 0%, var(--coral) 100%); color: var(--text); padding: 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; box-shadow: 0 8px 24px rgba(255,107,107,0.25); }
        .player-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; }
        .player-title { font-size: 0.78rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; }
        .player-percent { font-size: 2.5rem; font-weight: 900; line-height: 1; }
        .player-bar { height: 10px; background: rgba(255,255,255,0.25); border-radius: 5px; overflow: hidden; margin-bottom: 0.75rem; position: relative; }
        .player-fill { height: 100%; background: var(--text); border-radius: 5px; position: relative; }
        .player-fill::after { content: ''; position: absolute; right: -6px; top: -4px; width: 18px; height: 18px; background: var(--text); border-radius: 50%; box-shadow: 0 0 12px rgba(255,255,255,0.6); }
        .player-time { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; opacity: 0.95; font-family: 'SF Mono', Monaco, monospace; }

        .quality-section { margin-bottom: 1.75rem; }
        .quality-large-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .quality-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; }
        .quality-card-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .quality-card-label { font-size: 0.85rem; color: var(--text); font-weight: 700; }
        .quality-card-score { font-size: 1.2rem; color: var(--accent-soft); font-weight: 900; }
        .quality-card-bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .quality-card-fill { height: 100%; background: linear-gradient(90deg, var(--accent) 0%, var(--coral) 100%); border-radius: 4px; }

        .takeaway-section { background: linear-gradient(135deg, rgba(255,209,102,0.08) 0%, transparent 100%); border-left: 4px solid var(--gold); padding: 1.25rem 1.4rem; border-radius: 0 12px 12px 0; margin-bottom: 1.5rem; }
        .takeaway-text { color: var(--text); line-height: 1.6; font-size: 1.05rem; font-weight: 600; }

        .quote-section { background: linear-gradient(135deg, rgba(255,107,107,0.06) 0%, transparent 100%); border-left: 4px solid var(--accent); padding: 1.5rem 1.5rem 1.5rem 2rem; border-radius: 0 12px 12px 0; margin-bottom: 1.5rem; position: relative; }
        .quote-section::before { content: '"'; position: absolute; top: 0.5rem; left: 0.7rem; font-size: 4rem; color: var(--accent); opacity: 0.3; font-family: Georgia, serif; line-height: 1; }
        .quote-text { color: var(--text); line-height: 1.7; font-size: 1.05rem; font-style: italic; font-family: Georgia, serif; position: relative; z-index: 1; }

        .mood-section { background: rgba(139,92,246,0.06); border-left: 4px solid var(--purple); padding: 1.1rem 1.25rem; border-radius: 0 12px 12px 0; margin-bottom: 1.5rem; }
        .mood-text { color: var(--text); line-height: 1.6; font-size: 0.95rem; font-style: italic; }

        .review-section { margin-bottom: 1.5rem; padding: 1.1rem 1.25rem; background: var(--surface-2); border-radius: 12px; }
        .review-text { color: var(--text); line-height: 1.7; font-size: 0.95rem; padding: 0.4rem 0; }

        .feature-flags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
        .feature-flag { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.4rem 0.85rem; border-radius: 10px; font-size: 0.78rem; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); }
        .feature-flag.active { background: rgba(77,212,172,0.08); border-color: rgba(77,212,172,0.3); color: var(--success); }

        .info-rows { padding: 0.5rem 0 1rem; border-top: 1px solid var(--border); }
        .info-row { display: flex; padding: 0.6rem 0; font-size: 0.88rem; }
        .info-key { flex: 0 0 160px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; font-size: 0.7rem; padding-top: 0.1rem; }
        .info-val { color: var(--text); font-weight: 500; flex: 1; }

        .action-row { display: flex; gap: 0.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/episodes}">
        <span class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg></span>
        <span><span class="accent">Pod</span>Cast</span>
    </a>
    <ul class="navbar-nav">
        <li><a th:href="@{/episodes}">My Queue</a></li>
        <li><span class="user-badge" sec:authentication="name">user</span></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <button type="submit" class="btn btn-outline btn-sm">Logout</button>
            </form>
        </li>
    </ul>
</nav>

<div class="main">
    <div class="breadcrumb">
        <a th:href="@{/episodes}">My Queue</a> / <span th:text="${episode.title}"></span>
    </div>

    <div class="detail-card">
        <div class="status-stripe-large" th:classappend="${#strings.toLowerCase(episode.status.name())}"></div>

        <div class="hero">
            <div class="show-line-hero">
                <span class="subscribed-icon" th:if="${episode.subscribed}">⭐</span>
                <span th:text="${episode.showName}"></span>
                <span th:if="${episode.episodeNumber != null and !episode.episodeNumber.isBlank()}"
                      th:text="' · ' + ${episode.episodeNumber}"></span>
            </div>
            <div class="episode-title" th:text="${episode.title}"></div>

            <div class="hosts-line">
                <strong>Hosts:</strong> <span th:text="${episode.hosts}"></span>
            </div>
            <div class="hosts-line" th:if="${episode.guests != null and !episode.guests.isBlank()}">
                <strong>Guest:</strong> <span th:text="${episode.guests}"></span>
            </div>
            <div class="meta-line">
                <span th:if="${episode.network != null and !episode.network.isBlank()}" th:text="${episode.network}"></span>
                <span th:if="${episode.durationMinutes != null}" th:text="' · ' + ${episode.durationMinutes} + ' min'"></span>
                <span th:if="${episode.releaseDate != null}" th:text="' · ' + ${#temporals.format(episode.releaseDate, 'dd MMM yyyy')}"></span>
            </div>

            <div class="stars-large" th:if="${episode.rating != null}">
                <span th:each="i : ${#numbers.sequence(1,5)}"
                      th:classappend="${i <= episode.rating} ? 'star-filled' : 'star-empty'"
                      th:text="${i <= episode.rating} ? '★' : '☆'"></span>
            </div>

            <div class="badges-row">
                <span class="badge"
                      th:classappend="'badge-status-' + ${#strings.toLowerCase(episode.status.name())}"
                      th:text="${#strings.replace(episode.status.name(),'_',' ')}"></span>
                <span class="badge badge-category"
                      th:text="${#strings.replace(episode.category.name(),'_',' ')}"></span>
                <span class="badge badge-context" th:if="${episode.listeningContext != null}"
                      th:text="'🎧 ' + ${#strings.replace(episode.listeningContext.name(),'_',' ')}"></span>
                <span class="badge badge-speed" th:if="${episode.playbackSpeed != null}"
                      th:text="${#strings.replace(#strings.replace(episode.playbackSpeed.name(),'SPEED_',''),'_','.')}"></span>
                <span class="badge badge-explicit" th:if="${episode.explicitContent}">🅴 Explicit</span>
            </div>
        </div>

        <div class="body-section">

            <div class="player-card"
                 th:if="${episode.durationMinutes != null and episode.minutesListened != null and episode.minutesListened > 0}"
                 th:with="percent=${(episode.minutesListened * 100) / episode.durationMinutes}">
                <div class="player-header">
                    <span class="player-title">Listening Progress</span>
                    <span class="player-percent" th:text="${percent} + '%'"></span>
                </div>
                <div class="player-bar">
                    <div class="player-fill" th:style="'width:' + ${percent} + '%'"></div>
                </div>
                <div class="player-time">
                    <span th:text="${episode.minutesListened} + ':00'"></span>
                    <span th:text="${episode.durationMinutes} + ':00'"></span>
                </div>
            </div>

            <div class="quality-section"
                 th:if="${episode.contentQuality != null or episode.audioQuality != null or episode.hostChemistry != null or episode.rewatchValue != null}">
                <div class="section-title">Quality Breakdown</div>
                <div class="quality-large-grid">
                    <div class="quality-card" th:if="${episode.contentQuality != null}">
                        <div class="quality-card-header">
                            <span class="quality-card-label">📝 Content</span>
                            <span class="quality-card-score" th:text="${episode.contentQuality} + '/10'"></span>
                        </div>
                        <div class="quality-card-bar">
                            <div class="quality-card-fill" th:style="'width:' + (${episode.contentQuality} * 10) + '%'"></div>
                        </div>
                    </div>
                    <div class="quality-card" th:if="${episode.audioQuality != null}">
                        <div class="quality-card-header">
                            <span class="quality-card-label">🎙 Audio</span>
                            <span class="quality-card-score" th:text="${episode.audioQuality} + '/10'"></span>
                        </div>
                        <div class="quality-card-bar">
                            <div class="quality-card-fill" th:style="'width:' + (${episode.audioQuality} * 10) + '%'"></div>
                        </div>
                    </div>
                    <div class="quality-card" th:if="${episode.hostChemistry != null}">
                        <div class="quality-card-header">
                            <span class="quality-card-label">🤝 Host Chemistry</span>
                            <span class="quality-card-score" th:text="${episode.hostChemistry} + '/10'"></span>
                        </div>
                        <div class="quality-card-bar">
                            <div class="quality-card-fill" th:style="'width:' + (${episode.hostChemistry} * 10) + '%'"></div>
                        </div>
                    </div>
                    <div class="quality-card" th:if="${episode.rewatchValue != null}">
                        <div class="quality-card-header">
                            <span class="quality-card-label">⟳ Re-listen</span>
                            <span class="quality-card-score" th:text="${episode.rewatchValue} + '/10'"></span>
                        </div>
                        <div class="quality-card-bar">
                            <div class="quality-card-fill" th:style="'width:' + (${episode.rewatchValue} * 10) + '%'"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="takeaway-section" th:if="${episode.keyTakeaway != null and !episode.keyTakeaway.isBlank()}">
                <div class="section-title">💡 Key Takeaway</div>
                <p class="takeaway-text" th:text="${episode.keyTakeaway}"></p>
            </div>

            <div class="quote-section" th:if="${episode.memorableQuote != null and !episode.memorableQuote.isBlank()}">
                <div class="section-title">Memorable Quote</div>
                <p class="quote-text" th:text="${episode.memorableQuote}"></p>
            </div>

            <div class="mood-section" th:if="${episode.moodTags != null and !episode.moodTags.isBlank()}">
                <div class="section-title">Mood &amp; Vibes</div>
                <p class="mood-text" th:text="${episode.moodTags}"></p>
            </div>

            <div class="feature-flags">
                <span class="feature-flag" th:classappend="${episode.subscribed} ? 'active' : ''"
                      th:text="${episode.subscribed} ? '⭐ Subscribed' : '✗ Not Subscribed'"></span>
                <span class="feature-flag" th:classappend="${episode.recommendToFriend} ? 'active' : ''"
                      th:text="${episode.recommendToFriend} ? '♡ Recommended' : '✗ Not Recommended'"></span>
                <span class="feature-flag" th:classappend="${episode.bookmarkedQuote} ? 'active' : ''"
                      th:text="${episode.bookmarkedQuote} ? '🔖 Quote Bookmarked' : ''"></span>
            </div>

            <div class="review-section" th:if="${episode.review != null and !episode.review.isBlank()}">
                <div class="section-title">My Review</div>
                <p class="review-text" th:text="${episode.review}"></p>
            </div>

            <div class="review-section" th:if="${episode.personalNotes != null and !episode.personalNotes.isBlank()}">
                <div class="section-title">Personal Notes</div>
                <p class="review-text" th:text="${episode.personalNotes}"></p>
            </div>

            <div class="info-rows">
                <div class="info-row" th:if="${episode.mainTopic != null and !episode.mainTopic.isBlank()}">
                    <div class="info-key">Main Topic</div>
                    <div class="info-val" th:text="${episode.mainTopic}"></div>
                </div>
                <div class="info-row" th:if="${episode.seasonNumber != null}">
                    <div class="info-key">Season</div>
                    <div class="info-val" th:text="${episode.seasonNumber}"></div>
                </div>
                <div class="info-row" th:if="${episode.listenedDate != null}">
                    <div class="info-key">Listened</div>
                    <div class="info-val" th:text="${#temporals.format(episode.listenedDate, 'dd MMM yyyy')}"></div>
                </div>
                <div class="info-row" th:if="${episode.addedDate != null}">
                    <div class="info-key">Added</div>
                    <div class="info-val" th:text="${#temporals.format(episode.addedDate, 'dd MMM yyyy')}"></div>
                </div>
                <div class="info-row" th:if="${episode.addedBy != null}">
                    <div class="info-key">Added by</div>
                    <div class="info-val" th:text="${episode.addedBy}"></div>
                </div>
            </div>

            <div class="action-row">
                <a th:href="@{/episodes}" class="btn btn-outline">Back</a>
                <a th:href="@{/episodes/edit/{id}(id=${episode.id})}"
                   class="btn btn-primary" sec:authorize="hasRole('ADMIN')">Edit</a>
                <form th:action="@{/episodes/delete/{id}(id=${episode.id})}" method="post"
                      sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('Remove this episode?')">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>

spring.application.name=podcast-camel

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=ENC(LzzBxlgXzfLBFKCYvBHI1Q==)
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=camel-broker-demo
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

camel.springboot.main-run-controller=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Kafka configuration ? adapted from the course demo
camel.component.kafka.brokers=localhost:9094
camel.component.kafka.auto-offset-reset=earliest
camel.component.kafka.key-serializer=org.apache.kafka.common.serialization.StringSerializer
camel.component.kafka.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
camel.component.kafka.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
camel.component.kafka.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Camel route metrics
camel.metrics.enable-route-policy=true
camel.metrics.enable-message-history=true
camel.metrics.enable-exchange-event-notifier=true

# Spring Boot Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus,camelroutes
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}


# Module 6
# 256-bit (32 bytes) AES key, hex-encoded.
# Generate a fresh one with:
#   openssl rand -hex 32
# In production this would be sourced from a vault, not the YAML
app.crypto.aes-key-hex=${APP_CRYPTO_AES_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.crypto.aes-iv-hex=${APP_CRYPTO_AES_IV:00112233445566778899aabbccddeeff}

jasypt.encryptor.algorithm=PBEWithMD5AndDES
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.NoIvGenerator